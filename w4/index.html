<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朋友對我的動態留言板 🌟</title>
  <!-- 引入可愛風格 Google Fonts 標題字體 -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    /* =========================================================
       1. 全局變數與風格設定 (可在此輕鬆修改主題色彩與字體)
       ========================================================= */
    :root {
      /* 【主題顏色設定】 */
      --bg-color: #fdf6ff;             /* 背景基調：柔和淡粉紫 */
      --primary-color: #ff76ac;        /* 主色調：繽紛粉紅 */
      --secondary-color: #ffbd59;      /* 次色調：星星金黃 */
      --accent-color: #5271ff;         /* 強調色：夢幻藍 */
      --card-bg: #ffffff;              /* 卡片背景色 */
      --text-main: #4a4a4a;            /* 主要文字顏色 */
      --text-muted: #8c8c8c;           /* 輔助文字顏色 */
      
      /* 【輪播秒數設定】動態控制請參考 JavaScript */
      --highlight-scale: 1.08;          /* 聚焦時卡片放大倍率 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      background-color: var(--bg-color);
      /* 可愛繽紛星星格背景：使用 CSS 微型幾何圖案拼貼 */
      background-image: 
        radial-gradient(var(--secondary-color) 15%, transparent 16%),
        radial-gradient(var(--primary-color) 15%, transparent 16%);
      background-size: 60px 60px;
      background-position: 0 0, 30px 30px;
      color: var(--text-main);
      min-height: 100vh;
      padding: 30px 20px;
    }

    /* 頁面標題區塊 */
    header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-family: 'Fredoka One', 'Zen Maru Gothic', cursive;
      font-size: 2.8rem;
      color: var(--primary-color);
      text-shadow: 3px 3px 0px var(--secondary-color), 6px 6px 0px #fff;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 1.1rem;
      color: var(--text-main);
      font-weight: 700;
      background: rgba(255, 255, 255, 0.85);
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      border: 2px dashed var(--primary-color);
    }

    /* =========================================================
       2. 讀取中酷炫動畫 (Loading Animation)
       ========================================================= */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 80px;
    }

    .star-loader {
      font-size: 4rem;
      animation: spinAndPulse 1.5s infinite ease-in-out;
      display: inline-block;
      filter: drop-shadow(0 0 10px var(--secondary-color));
    }

    @keyframes spinAndPulse {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.3); }
      100% { transform: rotate(360deg) scale(1); }
    }

    .loading-text {
      margin-top: 15px;
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--primary-color);
      letter-spacing: 1px;
    }

    /* =========================================================
       3. 瀑布流排版 (Masonry Layout) & 卡片樣式
       ========================================================= */
    .masonry-grid {
      /* 關鍵設定：使用 CSS column-count 實現瀑布流 */
      column-count: 3;
      column-gap: 25px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* 響應式斷點：手機和平板螢幕自動調整欄數 */
    @media (max-width: 900px) {
      .masonry-grid { column-count: 2; }
    }
    @media (max-width: 600px) {
      .masonry-grid { column-count: 1; }
    }

    /* 留言卡片基礎樣式 */
    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 25px;
      /* 關鍵設定：防止卡片在欄位切割處斷開 */
      break-inside: avoid;
      border: 3px solid #f0e6f5;
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.05);
      position: relative;
      transition: transform 0.5s ease, filter 0.5s ease, opacity 0.5s ease, box-shadow 0.5s ease, border-color 0.5s ease;
      cursor: pointer;
    }

    /* 可愛可愛小飾點 (可愛拍立得膠帶) */
    .card::before {
      content: '✨';
      position: absolute;
      top: -12px;
      right: 20px;
      font-size: 1.2rem;
    }

    /* 留言者姓名 */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 2px dashed #f0f0f0;
      padding-bottom: 8px;
    }

    .card-name {
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--primary-color);
    }

    .card-time {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* 留言內容 */
    .card-body {
      font-size: 1rem;
      line-height: 1.6;
      word-wrap: break-word;
      color: var(--text-main);
    }

    /* =========================================================
       4. 隨時間輪播亮起 (Highlight) 效果
       ========================================================= */
    /* 1. 當網頁進入輪播狀態時，非焦點卡片變暗變模糊 */
    .masonry-grid.is-highlighting .card:not(.active) {
      opacity: 0.45;
      filter: blur(2px) grayscale(30%);
      transform: scale(0.96);
    }

    /* 2. 焦點被選中的卡片：放大、炫光與絢麗邊框 */
    .card.active {
      opacity: 1 !important;
      filter: blur(0) grayscale(0%) !important;
      transform: scale(var(--highlight-scale)) translateY(-5px) !important;
      z-index: 10;
      border-color: var(--secondary-color);
      box-shadow: 
        0 0 25px rgba(255, 189, 89, 0.6),
        0 12px 25px rgba(255, 118, 172, 0.3);
    }

    .card.active::after {
      content: '🌟';
      position: absolute;
      bottom: -15px;
      left: 20px;
      font-size: 1.5rem;
      animation: bounce 0.6s infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-8px); }
    }
  </style>
</head>
<body>

  <!-- 頁面標題區 -->
  <header>
    <h1>★ 朋友對我的動態留言板 ★</h1>
    <div class="subtitle">✨ 歡迎留下對我想說的話 ✨</div>
  </header>

  <!-- 1. 載入中動畫 (酷炫旋轉星星) -->
  <div id="loading">
    <div class="star-loader">🌟</div>
    <div class="loading-text">讀取留言中...</div>
  </div>

  <!-- 2. 瀑布流留言卡片牆 -->
  <div id="masonry-grid" class="masonry-grid"></div>

  <script>
    /* =========================================================
       5. JavaScript 邏輯控制
       ========================================================= */

    // 【參數設定】在此處調整輪播間隔時間 (毫秒)
    const ROTATE_INTERVAL_MS = 3000; // 3000 毫秒 = 3 秒

    // Google 試算表 CSV 網址
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRDJt6YmR5CYmcNNW_zx7CgWU9FFqk7FXtBlkhoXv4oJ7Dfqj66zdZ9iRiVai4U7W01rP1DI0nAC4JZ/pub?output=csv';

    let cardElements = []; // 儲存動態生成的卡片 DOM
    let currentIndex = -1;  // 目前亮起的卡片索引
    let timerId = null;     // 輪播計時器

    // 當文件完全讀取後執行
    document.addEventListener('DOMContentLoaded', () => {
      fetchComments();
    });

    /**
     * Fetch API 取得試算表 CSV 資料
     */
    async function fetchComments() {
      try {
        const response = await fetch(CSV_URL);
        if (!response.ok) throw new Error('網路回應異常');
        
        const csvText = await response.text();
        const dataArray = parseCSV(csvText);

        // 隱藏 Loading 動畫
        document.getElementById('loading').style.display = 'none';

        // 渲染卡片
        renderCards(dataArray);

        // 啟動 3 秒輪播特效
        if (dataArray.length > 0) {
          startHighlightRotation();
        }

      } catch (error) {
        console.error('讀取 CSV 失敗:', error);
        document.getElementById('loading').innerHTML = `
          <div style="color: var(--primary-color); font-size: 1.2rem; text-align: center;">
            😭 讀取留言失敗了，請稍微重新整理頁面試試！
          </div>
        `;
      }
    }

    /**
     * 健全的 CSV 解析器
     * 處理留言內容中包含雙引號 (")、逗號 (,) 及換行的狀況
     */
    function parseCSV(text) {
      const lines = [];
      let row = [];
      let currentToken = '';
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (insideQuotes && nextChar === '"') {
            currentToken += '"';
            i++; // 跳過轉義引號
          } else {
            insideQuotes = !insideQuotes; // 切換雙引號狀態
          }
        } else if (char === ',' && !insideQuotes) {
          row.push(currentToken.trim());
          currentToken = '';
        } else if ((char === '\r' || char === '\n') && !insideQuotes) {
          if (char === '\r' && nextChar === '\n') i++;
          row.push(currentToken.trim());
          if (row.some(field => field.length > 0)) {
            lines.push(row);
          }
          row = [];
          currentToken = '';
        } else {
          currentToken += char;
        }
      }
      
      if (currentToken || row.length > 0) {
        row.push(currentToken.trim());
        lines.push(row);
      }

      // 移除標題列 (時間戳記, 名字, 悄悄話)
      if (lines.length > 0) lines.shift();

      // 將資料對應為物件陣列
      return lines.map(cols => ({
        timestamp: cols[0] || '',
        name: cols[1] || '熱情的好朋友',
        message: cols[2] || '（這個人留下了悄悄話但沒有寫字喔～）'
      }));
    }

    /**
     * 動態生成卡片 DOM 並繪製於畫面上
     */
    function renderCards(data) {
      const grid = document.getElementById('masonry-grid');
      grid.innerHTML = '';

      data.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        
        // 格式化時間 (僅顯示年月日)
        let formattedTime = item.timestamp;
        if (item.timestamp) {
          const date = new Date(item.timestamp);
          if (!isNaN(date.getTime())) {
            formattedTime = `${date.getFullYear()}/${date.getMonth()+1}/${date.getDate()}`;
          }
        }

        // 卡片內部 HTML 結構
        card.innerHTML = `
          <div class="card-header">
            <span class="card-name">👤 ${escapeHTML(item.name)}</span>
            <span class="card-time">${escapeHTML(formattedTime)}</span>
          </div>
          <div class="card-body">
            ${escapeHTML(item.message).replace(/\n/g, '<br>')}
          </div>
        `;

        // 點擊卡片可手動切換至該卡片聚焦
        card.addEventListener('click', () => {
          setHighlightIndex(index);
        });

        grid.appendChild(card);
      });

      // 儲存所有的 DOM 節點方便後續進行 Highlight 切換
      cardElements = Array.from(document.querySelectorAll('.card'));
    }

    /**
     * 啟動依序 Highlight 輪播計時器 (預設 3 秒切換)
     */
    function startHighlightRotation() {
      const grid = document.getElementById('masonry-grid');
      grid.classList.add('is-highlighting'); // 啟用整體變暗樣式

      // 預設先亮起第一張
      setHighlightIndex(0);

      // 設定每 3 秒自動換下一個
      timerId = setInterval(() => {
        const nextIndex = (currentIndex + 1) % cardElements.length;
        setHighlightIndex(nextIndex);
      }, ROTATE_INTERVAL_MS);
    }

    /**
     * 設定特定 Index 的卡片高亮亮起
     */
    function setHighlightIndex(index) {
      if (cardElements.length === 0) return;

      // 移除上一個高亮狀態
      if (currentIndex >= 0 && cardElements[currentIndex]) {
        cardElements[currentIndex].classList.remove('active');
      }

      // 設定新的高亮卡片
      currentIndex = index;
      const activeCard = cardElements[currentIndex];
      activeCard.classList.add('active');

      // 平滑滾動確保聚焦卡片在視野範圍內（提升使用者體驗）
      activeCard.scrollIntoView({
        behavior: 'smooth',
        block: 'nearest'
      });
    }

    /**
     * XSS 防護字串轉義函式
     */
    function escapeHTML(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
