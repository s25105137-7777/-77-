<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人數位名片</title>
    <!-- 連結外部 CSS 樣式檔 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="card">
        <!-- 1. 圓形大頭貼 -->
        <img class="avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300" alt="大頭貼">[cite: 2]
        
        <!-- 2. 名字與簡短自我介紹 -->
        <h1 class="name">林小粉</h1>[cite: 2]
        <p class="bio">設計新手 🌸 喜歡用色彩與簡約視覺記錄生活與靈感。</p>[cite: 2]
        
        <!-- 3. 下方按鈕 -->
        <div class="button-group">
            <a href="https://instagram.com" class="btn btn-instagram" target="_blank" rel="noopener noreferrer">
                📸 INSTAGRAM
            </a>
            <a href="mailto:your-email@example.com" class="btn btn-email">
                ✉️ EMAIL
            </a>
        </div>
    </main>

</body>
</html>
