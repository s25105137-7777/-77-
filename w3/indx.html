<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>藍色星星格 🌟 迷因產生器</title>
  
  <!-- 1. 引入 Google Fonts (引入可愛風格字體與經典迷因字體) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">

  <!-- 2. 引入 html2canvas CDN (用來實作畫面截圖與下載功能) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    /* ====================================================
       【CSS 樣式區】：藍色可愛繽紛星星格主題
       ==================================================== */
    
    :root {
      --primary-blue: #4A90E2;
      --light-blue: #EBF3FA;
      --card-bg: #FFFFFF;
      --accent-yellow: #FFD166;
      --accent-pink: #FF85A1;
      --text-dark: #2B2D42;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans TC', sans-serif;
    }

    /* 背景：藍色淺色格子 + 可愛星星點綴效果 */
    body {
      background-color: var(--light-blue);
      /* 運用 CSS gradient 繪製格子圖案 */
      background-image: 
        linear-gradient(rgba(74, 144, 226, 0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(74, 144, 226, 0.15) 1px, transparent 1px);
      background-size: 24px 24px;
      color: var(--text-dark);
      padding: 20px 10px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 頁面標題區塊 */
    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-family: 'Mochiy Pop One', sans-serif;
      color: var(--primary-blue);
      font-size: 2rem;
      text-shadow: 2px 2px 0px #FFF, 4px 4px 0px var(--accent-yellow);
      letter-spacing: 1px;
    }

    header p {
      font-size: 0.95rem;
      color: #6C757D;
      margin-top: 6px;
    }

    /* 主容器：採用 Flexbox 排版（電腦版左右分欄，手機版上下排列） */
    .app-container {
      display: flex;
      flex-direction: row;
      gap: 24px;
      width: 100%;
      max-width: 1000px;
      align-items: flex-start;
    }

    /* 共通卡片容器樣式 */
    .panel-card {
      background: var(--card-bg);
      border: 3px solid var(--primary-blue);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 6px 6px 0px var(--primary-blue);
      position: relative;
    }

    /* 可愛裝飾性星星元素 */
    .panel-card::before {
      content: '★';
      position: absolute;
      top: -14px;
      left: 20px;
      background: var(--accent-yellow);
      color: var(--primary-blue);
      border: 2px solid var(--primary-blue);
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
    }

    /* 左側：控制面板區塊 */
    .controls-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 300px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-weight: bold;
      font-size: 0.9rem;
      color: var(--primary-blue);
      display: flex;
      justify-content: space-between;
    }

    /* 檔案上傳按鈕樣式 */
    .file-input-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
    }

    input[type="file"] {
      display: none;
    }

    .custom-file-btn {
      background-color: var(--light-blue);
      color: var(--primary-blue);
      border: 2px dashed var(--primary-blue);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      display: block;
    }

    .custom-file-btn:hover {
      background-color: #D9E8F5;
      transform: translateY(-1px);
    }

    /* 文字輸入框樣式 */
    input[type="text"] {
      padding: 10px 14px;
      border: 2px solid var(--primary-blue);
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent-pink);
    }

    /* 範圍滑桿樣式 */
    input[type="range"] {
      accent-color: var(--primary-blue);
      cursor: pointer;
    }

    /* 超酷下載按鈕 */
    .download-btn {
      background-color: var(--accent-yellow);
      color: var(--text-dark);
      border: 2px solid var(--text-dark);
      border-radius: 14px;
      padding: 14px;
      font-size: 1.1rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 3px 3px 0px var(--text-dark);
      transition: all 0.15s ease-in-out;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .download-btn:hover {
      background-color: #FFE08A;
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0px var(--text-dark);
    }

    .download-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px var(--text-dark);
    }

    /* 右側：迷因預覽區塊 */
    .preview-panel {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 300px;
    }

    /* 迷因畫布區塊 (包含底圖與疊加文字) */
    .meme-stage {
      position: relative;
      width: 100%;
      max-width: 450px;
      background-color: #E2E8F0;
      border: 3px solid var(--text-dark);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 300px;
    }

    /* 底圖 */
    .meme-stage img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }

    /* 迷因文字共通樣式：全大寫、粗黑邊框 (text-shadow) */
    .meme-text {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      text-align: center;
      color: white;
      font-family: Impact, 'Noto Sans TC', sans-serif;
      font-weight: 900;
      text-transform: uppercase;
      word-wrap: break-word;
      line-height: 1.2;
      user-select: none;
      
      /* 關鍵：8 個方向的黑色粗邊框，確保任何背景都清晰 */
      text-shadow:
        -2px -2px 0 #000,  
         2px -2px 0 #000,
        -2px  2px 0 #000,
         2px  2px 0 #000,
        -3px  0px 0 #000,
         3px  0px 0 #000,
         0px -3px 0 #000,
         0px  3px 0 #000;
    }

    /* 上方文字位置 */
    #top-text-display {
      top: 10px;
    }

    /* 下方文字位置 */
    #bottom-text-display {
      bottom: 10px;
    }

    /* ====================================================
       【RWD 響應式排版】：針對手機板螢幕優化
       ==================================================== */
    @media (max-width: 768px) {
      .app-container {
        flex-direction: column; /* 改為上下垂直排列 */
      }
      
      .preview-panel {
        order: -1; /* 將預覽區移到上方，方便手機使用者邊調邊看 */
        width: 100%;
      }
      
      .controls-panel {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- 標題區 -->
  <header>
    <h1>✨ 迷因產生器 ✨</h1>
    <p>打造專屬於你的藍色可愛風格 Meme！</p>
  </header>

  <!-- 主要應用程式內容區塊 -->
  <div class="app-container">
    
    <!-- 左側：控制面板 -->
    <div class="panel-card controls-panel">
      
      <!-- 1. 本機圖片上傳 -->
      <div class="form-group">
        <label>1. 上傳底圖 (本機檔案)</label>
        <label for="image-upload" class="custom-file-btn">
          📁 選擇電腦/手機中的圖片
        </label>
        <input type="file" id="image-upload" accept="image/*">
      </div>

      <!-- 2. 上方與下方文字輸入 -->
      <div class="form-group">
        <label for="top-text-input">2. 上方文字</label>
        <input type="text" id="top-text-input" placeholder="例如：當你寫完 Code">
      </div>

      <div class="form-group">
        <label for="bottom-text-input">3. 下方文字</label>
        <input type="text" id="bottom-text-input" placeholder="例如：發現居然一次就過！">
      </div>

      <!-- 3. 字體大小控制 -->
      <div class="form-group">
        <label for="font-size-slider">
          4. 字體大小 
          <span id="font-size-val">32px</span>
        </label>
        <input type="range" id="font-size-slider" min="16" max="64" value="32">
      </div>

      <!-- 4. 上方文字位置微調 -->
      <div class="form-group">
        <label for="top-pos-slider">
          5. 上方文字垂直位置 
          <span id="top-pos-val">10px</span>
        </label>
        <input type="range" id="top-pos-slider" min="0" max="150" value="10">
      </div>

      <!-- 5. 下方文字位置微調 -->
      <div class="form-group">
        <label for="bottom-pos-slider">
          6. 下方文字垂直位置 
          <span id="bottom-pos-val">10px</span>
        </label>
        <input type="range" id="bottom-pos-slider" min="0" max="150" value="10">
      </div>

      <!-- 6. 一鍵下載按鈕 -->
      <button class="download-btn" id="download-btn">
        🚀 一鍵下載迷因 (my-meme.png)
      </button>

    </div>

    <!-- 右側：迷因即時預覽區 -->
    <div class="panel-card preview-panel">
      <div class="meme-stage" id="meme-stage">
        <!-- 預設占位圖 (使用 SVG 畫出的可愛圖片提示) -->
        <img id="meme-image" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='300' viewBox='0 0 400 300'><rect width='400' height='300' fill='%23DCE7F5'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-size='20' fill='%234A90E2'>請先上傳一張圖片 🌟</text></svg>" alt="迷因底圖">
        
        <!-- 疊加的迷因文字 -->
        <div class="meme-text" id="top-text-display"></div>
        <div class="meme-text" id="bottom-text-display"></div>
      </div>
    </div>

  </div>

  <!-- ====================================================
     【JavaScript 邏輯區】：互動與圖片轉換處理
     ==================================================== -->
  <script>
    // 1. 取得 DOM 元素 (抓住網頁上的控制元件與顯示區塊)
    const imageUpload = document.getElementById('image-upload');
    const memeImage = document.getElementById('meme-image');
    
    const topTextInput = document.getElementById('top-text-input');
    const bottomTextInput = document.getElementById('bottom-text-input');
    const topTextDisplay = document.getElementById('top-text-display');
    const bottomTextDisplay = document.getElementById('bottom-text-display');

    const fontSizeSlider = document.getElementById('font-size-slider');
    const fontSizeVal = document.getElementById('font-size-val');
    
    const topPosSlider = document.getElementById('top-pos-slider');
    const topPosVal = document.getElementById('top-pos-val');
    
    const bottomPosSlider = document.getElementById('bottom-pos-slider');
    const bottomPosVal = document.getElementById('bottom-pos-val');

    const downloadBtn = document.getElementById('download-btn');
    const memeStage = document.getElementById('meme-stage');

    // 2. 本機圖片上傳邏輯 (使用 FileReader 避開 CORS 安全限制)
    imageUpload.addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        
        // 當檔案讀取完成後，將 Base64 數據傳給 <img> 的 src 屬性
        reader.onload = function(e) {
          memeImage.src = e.target.result;
        };
        
        reader.readAsDataURL(file); // 開始讀取檔案
      }
    });

    // 3. 即時更新文字內容
    topTextInput.addEventListener('input', () => {
      topTextDisplay.textContent = topTextInput.value;
    });

    bottomTextInput.addEventListener('input', () => {
      bottomTextDisplay.textContent = bottomTextInput.value;
    });

    // 4. 即時調整字體大小
    fontSizeSlider.addEventListener('input', () => {
      const size = fontSizeSlider.value + 'px';
      topTextDisplay.style.fontSize = size;
      bottomTextDisplay.style.fontSize = size;
      fontSizeVal.textContent = size; // 更新數值顯示
    });

    // 5. 即時微調上方文字位置 (Top)
    topPosSlider.addEventListener('input', () => {
      const pos = topPosSlider.value + 'px';
      topTextDisplay.style.top = pos;
      topPosVal.textContent = pos;
    });

    // 6. 即時微調下方文字位置 (Bottom)
    bottomPosSlider.addEventListener('input', () => {
      const pos = bottomPosSlider.value + 'px';
      bottomTextDisplay.style.bottom = pos;
      bottomPosVal.textContent = pos;
    });

    // 7. 一鍵截圖下載功能 (運用 html2canvas 庫)
    downloadBtn.addEventListener('click', () => {
      // 提示使用者正在處理中
      const originalBtnText = downloadBtn.innerText;
      downloadBtn.innerText = '⏳ 正在產生圖片中...';
      downloadBtn.disabled = true;

      // 使用 html2canvas 將 #meme-stage 區塊轉為 Canvas 畫布
      html2canvas(memeStage, {
        scale: 2,           // 提高渲染畫質 (2倍清晰度)
        useCORS: true,       // 允許跨域圖片轉繪
        backgroundColor: null // 保持背景透明度設定
      }).then(canvas => {
        // 將 Canvas 轉為圖片下載連結
        const link = document.createElement('a');
        link.download = 'my-meme.png';            // 指定下載檔名
        link.href = canvas.toDataURL('image/png'); // 取得 Data URL
        link.click();                             // 自動觸發下載

        // 恢復按鈕狀態
        downloadBtn.innerText = originalBtnText;
        downloadBtn.disabled = false;
      }).catch(err => {
        console.error('截圖失敗:', err);
        alert('下載圖片時發生錯誤，請稍後再試！');
        downloadBtn.innerText = originalBtnText;
        downloadBtn.disabled = false;
      });
    });

    // 初始化設定一次字型大小與位置
    topTextDisplay.style.fontSize = fontSizeSlider.value + 'px';
    bottomTextDisplay.style.fontSize = fontSizeSlider.value + 'px';
  </script>
</body>
</html>
